name: Build Logic

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      overwrite_existing_tag:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Overwrite existing tag
        if: inputs.overwrite_existing_tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/$TAG_NAME" > /dev/null
          TAG_STATUS=$?
          set -e

          case "$TAG_STATUS" in
            0)
              git tag --force "$TAG_NAME" "$GITHUB_SHA"
              git push --force origin "refs/tags/$TAG_NAME"
              ;;
            2)
              echo "Tag $TAG_NAME 不存在，将由 Release 创建。"
              ;;
            *)
              echo "::error::无法检查远端 Tag $TAG_NAME"
              exit "$TAG_STATUS"
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install asar
        run: npm install -g asar

      - name: Build asar
        run: |
          ID=$(jq -er '.id | strings | select(length > 0)' mod/modloader.mod.json)
          asar pack mod "$ID.asar"
          echo "ID=$ID" >> "$GITHUB_ENV"

      - name: Verify build
        run: |
          if [ ! -f "$ID.asar" ]; then
            echo "::error::构建失败：$ID.asar 不存在"
            exit 1
          fi
          echo "构建成功：$ID.asar"

      - name: Calculate ASAR SHA-256
        run: |
          SHA256=$(sha256sum "$ID.asar" | awk '{print $1}')
          if ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::无法计算有效的 SHA-256"
            exit 1
          fi
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Generate Changelog
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          # 使用当前工作流所在的 Commit
          CURRENT_COMMIT=$(git rev-parse HEAD)

          # 取提交图上距离当前 Commit 最近的 tag，而非版本号最高的 tag。
          # 排除当前发布 tag，以支持手动覆盖既有 Release。
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG_NAME" "$CURRENT_COMMIT" 2>/dev/null || true)

          echo "当前版本：$TAG_NAME"
          echo "当前 Commit：$CURRENT_COMMIT"
          echo "上一个版本：${PREVIOUS_TAG:-无}"

          # 生成更新日志
          CHANGELOG_FILE="$RUNNER_TEMP/changelog.md"

          if [ -n "$PREVIOUS_TAG" ]; then
            git log "$PREVIOUS_TAG..$CURRENT_COMMIT" \
              --pretty=format:"%s" \
              --no-merges \
              --reverse > "$CHANGELOG_FILE"
          else
            git log "$CURRENT_COMMIT" \
              --pretty=format:"%s" \
              --no-merges \
              --reverse > "$CHANGELOG_FILE"
          fi

          # 没有更新时使用默认内容
          if [ ! -s "$CHANGELOG_FILE" ]; then
            echo "暂无更新" > "$CHANGELOG_FILE"
          fi

          echo "CHANGELOG_FILE=$CHANGELOG_FILE" >> "$GITHUB_ENV"

          echo "生成的更新日志："
          cat "$CHANGELOG_FILE"

      - name: Generate update.json
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          UPDATE_JSON="$RUNNER_TEMP/update.json"

          jq --rawfile changelog "$CHANGELOG_FILE" \
             --arg id "$ID" \
             --arg asarUrl "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/$ID.asar" \
             --arg sha256 "$SHA256" \
             'del(.update, .injections) + {id: $id, asarUrl: $asarUrl, sha256: $sha256, changelog: $changelog}' \
             mod/modloader.mod.json > "$UPDATE_JSON"

          jq -e --arg id "$ID" '
            .id == $id
            and ((.sha256 | type) == "string")
            and (.sha256 | test("^[0-9a-f]{64}$"))
          ' "$UPDATE_JSON" > /dev/null

          echo "UPDATE_JSON=$UPDATE_JSON" >> "$GITHUB_ENV"

          echo "update.json 生成成功"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag_name }}
          body_path: ${{ env.CHANGELOG_FILE }}
          files: |
            ${{ env.ID }}.asar
            ${{ env.UPDATE_JSON }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
