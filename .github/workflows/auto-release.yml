name: Auto Release

on:
  push:
    branches: [ main ]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      
      - name: Get version and check tag
        id: ver
        run: |
          NEW=$(jq -er '.version | strings | select(length > 0)' mod/modloader.mod.json)
          git check-ref-format --allow-onelevel "$NEW"

          # --exit-code 返回 0 表示精确匹配到 tag，2 表示 tag 不存在。
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/$NEW" > /dev/null
          TAG_STATUS=$?
          set -e

          case "$TAG_STATUS" in
            0)
              echo "Tag $NEW 已存在，跳过发布。"
              exit 0
              ;;
            2)
              ;;
            *)
              echo "::error::无法检查远端 Tag $NEW"
              exit "$TAG_STATUS"
              ;;
          esac
          
          echo "ver=$NEW" >> $GITHUB_OUTPUT

    outputs:
      new_version: ${{ steps.ver.outputs.ver }}

  call-build:
    needs: check-and-call
    if: needs.check-and-call.outputs.new_version != ''
    uses: ./.github/workflows/build-logic.yml
    with:
      tag_name: ${{ needs.check-and-call.outputs.new_version }}
